
services:
  postgres:
    image: postgres:16-alpine
    container_name: whisper-mart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whisper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whisper}
      POSTGRES_DB: ${POSTGRES_DB:-whisper_mart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whisper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whisper-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whisper-mart-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://whisper:whisper@postgres:5432/whisper_mart}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      ENV: ${ENV:-production}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_KEY_ID: ${PAYMENT_KEY_ID:-}
      PAYMENT_KEY_SECRET: ${PAYMENT_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - whisper-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: whisper-mart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - whisper-net

volumes:
  pgdata:
  uploads:

networks:
  whisper-net:
    driver: bridge
